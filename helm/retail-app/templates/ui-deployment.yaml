apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-app-ui
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      app: retail-app-ui
  template:
    metadata:
      labels:
        app: retail-app-ui
    spec:
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          ports:
            - containerPort: 8080
